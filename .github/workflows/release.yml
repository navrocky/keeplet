# Builds the widget on a release tag (x.y.z, e.g. 1.2.0) and attaches it to that tag's GitHub
# release — creating the release if the tag was pushed from git, or reusing it if it was created
# in the GitHub UI (which also creates the tag and triggers this same push event). An annotated
# tag's message becomes the release notes (docs/release.md).
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tags and history for the version

      - name: Build (tests, lint, package)
        run: scripts/build.sh
        env:
          # Only release builds send usage statistics (docs/analytics.md).
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}

      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Only the build of this very tag: a version with a commit count or hash
          # (0.1.0-12-gabc1234) is an intermediate build and never goes to a release.
          # dist/SHA256SUMS comes from scripts/package.sh.
          asset="dist/keeplet-${TAG}.plasmoid"
          test "$(ls dist/keeplet-*.plasmoid)" = "$asset"
          # Release notes = the annotated tag's message minus its first line (the version).
          # Re-fetched explicitly: checkout can leave the tag as a lightweight one. A lightweight
          # tag (e.g. from the GitHub UI) has no notes to offer — then GitHub's generated ones,
          # and an existing release's notes are left alone.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          notes=(--generate-notes)
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
              git tag -l --format='%(contents)' "$TAG" | tail -n +2 > notes.md
              notes=(--notes-file notes.md)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
              if [ "${notes[0]}" = --notes-file ]; then
                  gh release edit "$TAG" "${notes[@]}"
              fi
          else
              gh release create "$TAG" --verify-tag --title "$TAG" "${notes[@]}"
          fi
          gh release upload "$TAG" "$asset" dist/SHA256SUMS --clobber
